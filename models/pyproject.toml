[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pebr-models"
version = "0.1.0"
description = "PEBR Option B poll aggregator (√N trailing window + anti-flood)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pebr-chart = "pebr_models.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pebr_models*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
