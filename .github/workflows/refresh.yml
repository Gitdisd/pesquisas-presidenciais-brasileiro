# PEBR pipeline refresh — validate + assemble drift check.
# Does NOT fetch live poll pages, invent numbers, or regenerate Option B chart.json.
# Pages UI (site/index.html, css/, js/) is Lead-owned. Option B re-export is Lead’s step.

name: pebr-refresh

on:
  workflow_dispatch:
  schedule:
    # Daily 06:00 UTC ≈ 03:00 America/Sao_Paulo — cheap consistency check
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "fixtures/**"
      - "lib/**"
      - "bin/**"
      - "Gemfile*"
      - "config/**"
      - "data/national/**"
      - "site/data/canonical-points.json"
      - "site/data/canonical-points-2nd-round.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: read

jobs:
  validate-assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Bundle install
        run: bundle install --jobs 4

      - name: Validate fixtures + data/national/**
        run: bin/pebr validate

      - name: Identity fingerprint report
        run: bin/pebr normalize

      - name: Assemble canonical-points (1º + 2º)
        run: bin/pebr assemble

      - name: Fail if canonical-points drifted
        run: |
          git diff --exit-code -- site/data/canonical-points.json
          git diff --exit-code -- site/data/canonical-points-2nd-round.json

      # Option B / chart.json: Lead re-runs models CLI separately when canonical-points change.
      # Do not auto-commit or regenerate chart series here.
